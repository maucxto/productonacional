<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina - Producto Nacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');
        
        :root {
            --primary-gold: #d4a574;
            --primary-gold-light: #e6c08a;
            --primary-gold-dark: #b8935f;
            --text-dark: #1a1a1a;
            --text-light: #6b7280;
            --bg-cream: #faf8f5;
            --bg-white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
        }

        .font-display {
            font-family: 'Playfair Display', serif;
        }

        .gradient-gold {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--primary-gold-light) 100%);
        }

        .text-gold {
            color: var(--primary-gold);
        }

        .border-gold {
            border-color: var(--primary-gold);
        }

        .order-card {
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 165, 116, 0.25);
        }

        .status-pending {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
        }

        .status-preparing {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
        }

        .status-ready {
            background: linear-gradient(135deg, #10b981, #34d399);
        }

        .timer {
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .pulse-animation {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .notification-badge {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-100 px-6 py-4">
        <div class="flex items-center justify-between max-w-7xl mx-auto">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 gradient-gold rounded-full flex items-center justify-center">
                    <i class="fas fa-fire text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="font-display text-2xl font-bold text-gray-800">Cocina</h1>
                    <p class="text-sm text-gray-500">Estación de preparación de alimentos</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <div class="text-sm text-gray-500">Órdenes pendientes</div>
                    <div class="text-2xl font-bold text-gold" id="pending-count">0</div>
                </div>
                <div class="w-4 h-4 bg-red-500 rounded-full notification-badge hidden" id="new-order-indicator"></div>
            </div>
        </div>
    </header>

    <!-- Filter Tabs -->
    <div class="bg-white border-b border-gray-100 px-6 py-3">
        <div class="flex space-x-4 max-w-7xl mx-auto">
            <button onclick="filterOrders('all')" 
                    class="filter-btn px-4 py-2 rounded-lg bg-amber-100 text-amber-800 font-medium">
                Todas
            </button>
            <button onclick="filterOrders('pending')" 
                    class="filter-btn px-4 py-2 rounded-lg bg-gray-100 text-gray-600 font-medium hover:bg-gray-200">
                Pendientes
            </button>
            <button onclick="filterOrders('preparing')" 
                    class="filter-btn px-4 py-2 rounded-lg bg-gray-100 text-gray-600 font-medium hover:bg-gray-200">
                En preparación
            </button>
            <button onclick="filterOrders('ready')" 
                    class="filter-btn px-4 py-2 rounded-lg bg-gray-100 text-gray-600 font-medium hover:bg-gray-200">
                Listas
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="px-6 py-6">
        <div class="max-w-7xl mx-auto">
            <!-- Orders Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="orders-grid">
                <!-- Orders will be populated by JavaScript -->
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="text-center py-12 hidden">
                <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-utensils text-4xl text-gray-400"></i>
                </div>
                <h3 class="text-xl font-semibold text-gray-600 mb-2">No hay órdenes pendientes</h3>
                <p class="text-gray-500">Las nuevas órdenes aparecerán aquí automáticamente</p>
            </div>
        </div>
    </main>

    <!-- Order Detail Modal -->
    <div id="order-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black bg-opacity-50" onclick="closeOrderModal()"></div>
        <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-2xl w-full max-w-lg transform transition-transform duration-300 scale-95" id="modal-content">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Success Sound (hidden) -->
    <audio id="success-sound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT" type="audio/wav">
    </audio>

    <script type="module" src="kitchen.js"></script>
</body>
</html>
